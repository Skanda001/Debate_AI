version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DJANGO_SETTINGS_MODULE=backend.settings
      # Add any other production settings here. 
      # Note: CORS settings must be updated in your Django settings.py to allow requests from the frontend's port (8080).
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    # Ensures the frontend waits for the backend to be ready
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"] 
      interval: 30s
      timeout: 10s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"  # Maps container port 80 to host port 8080
    depends_on:
      - backend
    environment:
      # Vite builds use build-time variables. 
      # You must pass the API URL to the frontend at build time.
      - VITE_API_BASE=http://localhost:8000/api
